experiment:
  id: EXP-002
  name: codebert_poj104
  status: READY_FOR_GPU
  seed: 42

dataset:
  name: poj104
  language: cpp
  manifest: data/manifests/poj104.json
  pairs_dir: data/pairs/poj104
  processed: data/processed/poj104/samples.jsonl

model:
  id: M1
  hf_id: microsoft/codebert-base
  pair_architecture: concat_hA_hB_absdiff_mlp
  dropout: 0.1

tokenizer:
  max_length: 256
  truncation: true
  padding: dynamic

training:
  seed: 42
  epochs: 3
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mixed_precision: true

early_stopping:
  enabled: true
  monitor: val_f1
  patience: 2
  mode: max

inference:
  pair_batch_size: 64

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]

error_analysis:
  top_k: 100

runtime:
  device: cuda

output:
  directory: results/exp002_codebert_poj104
