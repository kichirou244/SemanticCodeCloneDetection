# EXP-006 — M5 Hybrid GraphCodeBERT + CPG-GNN trên POJ-104 (C++).
# Trạng thái: READY_FOR_KAGGLE_TRAIN (DEC-029 + audit `results/audit_m2_m4.json`
# ủng hộ soft fusion: logistic (s_M2, s_M4) test F1 0.9217 vs M2 0.9069).
#
# Khởi tạo encoder từ warm start M2 (EXP-003) + M4 (EXP-005) để tái dùng đúng
# biểu diễn mà audit nhìn thấy, rồi joint fine-tune với LR nhỏ.

experiment:
  id: EXP-006
  name: hybrid_graphcodebert_cpg_poj104
  status: READY_FOR_KAGGLE_TRAIN
  seed: 42

dataset:
  name: poj104
  language: cpp
  manifest: data/manifests/poj104.json
  pairs_dir: data/pairs/poj104
  processed: data/processed/poj104/samples.jsonl

model:
  id: M5
  type: hybrid
  language: cpp
  hf_id: microsoft/graphcodebert-base
  graph_hidden_size: 128          # = CPGEncoder M4 (results/exp005)
  graph_num_layers: 3
  graph_heads: 4
  graph_dropout: 0.2
  head_hidden_size: 1024          # MLP fusion (khối head mới, không phải head của M2/M4)
  head_dropout: 0.1
  # h = [h_text ; h_graph], head = [hA ; hB ; |hA-hB|] -> MLP (DEC-005 concat_mlp + DEC-016)
  pair_architecture: concat_hA_hB_absdiff_mlp
  # Warm start từ encoder đã fine-tune. File thiếu -> model cảnh báo và dùng
  # pretrained/scratch (an toàn cho smoke/test local).
  warm_start:
    text: results/exp003_graphcodebert_poj104/best_checkpoint.pt
    graph: results/exp005_cpg_gnn_poj104/best_checkpoint.pt

tokenizer:
  max_length: 256                  # giữ nguyên M1/M2 (DEC-022) để so sánh sạch
  truncation: true
  padding: dynamic

# CPG không truncate theo độ dài văn bản; nó bị giới hạn theo **số node**.
# Cache dùng lại đúng của EXP-005 (không parse lại Joern).
preprocessing:
  max_nodes: 1500
  export_dir: artifacts/cpg_export   # JSON từng hàm do Joern sinh (EXP-005)
  cache_dir: artifacts/cpg_cache
  extractor: joern

training:
  seed: 42
  # true  = khóa encoder M2/M4, chỉ train head MLP (bản rẻ, ~đúng logistic nhưng
  #         trên embedding 1024 chiều). false = joint fine-tune (bản đầy đủ, tốn GPU).
  freeze_encoders: false
  # LR nhỏ vì warm start từ encoder đã train xong — LR to sẽ phá biểu diễn.
  epochs: 5
  batch_size: 12                    # text + GAT trong 1 step -> VRAM lớn hơn M4
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mixed_precision: true

diagnostic:
  bench_steps: 20

early_stopping:
  enabled: true
  monitor: val_f1
  patience: 2
  mode: max

inference:
  pair_batch_size: 32

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]

error_analysis:
  top_k: 100

runtime:
  device: cuda

output:
  directory: results/exp006_hybrid_poj104