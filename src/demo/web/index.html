<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic Code Clone Detection — Demo trực quan</title>
<meta name="description" content="Demo phát hiện clone mã nguồn: tải file .zip, chấm mọi cặp bằng 5 model, tải báo cáo kết quả, xem đoạn khớp bôi màu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/scores.css">
<link rel="stylesheet" href="/static/css/diff.css">
<link rel="stylesheet" href="/static/css/scan.css">
</head>
<body>
<header class="app-header">
  <div class="app-header__brand">
    <h1 class="app-header__title">Semantic Code Clone Detection</h1>
    <p class="app-header__subtitle">
      Tải file .zip · quét mọi cặp bằng 5 model · tải báo cáo · bấm hàng để xem đoạn khớp bôi màu
    </p>
  </div>
</header>

<main class="app-layout app-layout--single">
  <section class="workspace">
    <section class="score-strip" id="score-strip"
             aria-label="Điểm và phán quyết của từng model"></section>

    <section class="panel panel--flush">
      <div class="scan-panel">
        <div class="scan-toolbar">
          <h2 class="scan-toolbar__title">Quét file .zip (5 models)</h2>
          <div class="scan-toolbar__controls">
            <label class="btn btn-file">Chọn .zip<input type="file" id="zip-file" accept=".zip" hidden></label>
            <span class="zip-file-name" id="zip-file-name">Chưa chọn file</span>
            <button type="button" class="btn" id="btn-upload">Tải lên</button>
          </div>
        </div>
        <div class="zip-models" id="zip-models"></div>
        <div class="scan-toolbar__controls">
          <label class="scan-threshold">
            <span>Ngưỡng</span>
            <b id="zip-threshold-value">50%</b>
            <input type="range" id="zip-threshold" min="0" max="100" step="1" value="50"
                   aria-label="Ngưỡng điểm để giữ cặp">
          </label>
          <label class="zip-frozen">
            <input type="checkbox" id="zip-frozen" checked>
            Ngưỡng từng model (đúng báo cáo)
          </label>
          <button type="button" class="btn btn--primary" id="btn-zip-scan">Quét tất cả cặp</button>
        </div>
        <div class="scan-results" id="zip-results"></div>
        <p class="scan-meta" id="zip-note"></p>
      </div>
    </section>

    <section class="panel panel--flush">
      <div class="alignment-bar">
        <div class="alignment-bar__stats" id="alignment-stats"></div>
        <div class="alignment-bar__legend" id="block-legend"
             aria-label="Chú giải các khối khớp"></div>
      </div>
      <div class="diff" id="diff-view">
        <p class="empty-state" id="empty-state">
          Tải file .zip lên, bấm <b>Quét tất cả cặp</b>, rồi bấm một hàng kết quả để xem đoạn khớp bôi màu.
        </p>
      </div>
    </section>
  </section>
</main>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
