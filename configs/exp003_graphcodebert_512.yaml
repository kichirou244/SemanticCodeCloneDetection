experiment:
  id: EXP-003-512
  name: graphcodebert_poj104_512
  status: READY_FOR_KAGGLE_TRAIN
  seed: 42

dataset:
  name: poj104
  language: cpp
  manifest: data/manifests/poj104.json
  pairs_dir: data/pairs/poj104
  processed: data/processed/poj104/samples.jsonl

model:
  id: M2
  hf_id: microsoft/graphcodebert-base
  pair_architecture: concat_hA_hB_absdiff_mlp
  dropout: 0.1
  # Warm-start từ checkpoint 256 (cùng kiến trúc, pos-embeds sẵn 512).
  # Notebook Kaggle tải file này từ HuggingFace về đúng path trước khi train.
  warm_start: results/exp003_graphcodebert_poj104/best_weights_only.pt

tokenizer:
  max_length: 512
  truncation: true
  padding: dynamic

# Giống hệt EXP-002-512: mọi khác biệt phải đến từ pretrained weights,
# không đến từ hyperparameter.
training:
  seed: 42
  epochs: 3
  # 512 token ~4x VRAM attention so với 256 -> giảm batch một nửa,
  # tăng accum gấp đôi để effective batch giữ nguyên 32.
  batch_size: 8
  learning_rate: 0.00002
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  mixed_precision: true

early_stopping:
  enabled: true
  monitor: val_f1
  patience: 2
  mode: max

inference:
  pair_batch_size: 32

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]

error_analysis:
  top_k: 100

runtime:
  device: cuda

output:
  directory: results/exp003_graphcodebert_poj104_512
