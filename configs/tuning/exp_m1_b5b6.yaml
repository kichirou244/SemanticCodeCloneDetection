experiment:
  id: EXP-M1-B5B6
  name: codebert_diffmul_focal_aug_supcon
  seed: 42

dataset:
  name: bigclonebench
  language: java
  hf_id: google/code_x_glue_cc_clone_detection_big_clone_bench
  data_dir: data/raw/bigclonebench
  smoke_file: data/raw/bigclonebench/bcb_smoke.parquet
  dev_file: data/raw/bigclonebench/bcb_dev.parquet

model:
  id: M1
  hf_id: microsoft/codebert-base
  pair_architecture: diff_mul
  dropout: 0.2

tokenizer:
  max_length: 512
  truncation: true
  padding: dynamic

training:
  seed: 42
  epochs: 8
  batch_size: 16
  learning_rate: 0.00001
  min_lr: 0.000001
  weight_decay: 0.05
  label_smoothing: 0.05
  warmup_ratio: 0.1
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0
  mixed_precision: true
  loss:
    type: focal
    gamma: 2.0
    alpha: 0.5

# B6: augmentation giữ nhãn (xóa comment + đổi tên identifier) và SupCon trên CLS
augmentation:
  enabled: true
  rename_prob: 0.5
  strip_comments_prob: 0.5
  seed: 42

supcon:
  enabled: true
  weight: 0.1
  temperature: 0.07

early_stopping:
  enabled: true
  monitor: val_loss
  patience: 5
  min_delta: 0.0005
  mode: min

inference:
  pair_batch_size: 64

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]
  clone_types: [Type-1, Type-2, Strongly-Type-3, Moderately-Type-3, Weakly-Type-3-Type-4]
