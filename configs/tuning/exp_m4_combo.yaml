experiment:
  id: EXP-M4-COMBO
  name: cpg_gnn_combo_ep20_lr1e4
  seed: 42

dataset:
  name: bigclonebench
  language: java
  hf_id: google/code_x_glue_cc_clone_detection_big_clone_bench
  data_dir: data/raw/bigclonebench
  smoke_file: data/raw/bigclonebench/bcb_smoke.parquet
  dev_file: data/raw/bigclonebench/bcb_dev.parquet

model:
  id: M4
  architecture: cpg_gat
  gnn_type: GAT
  node_feature_dim: 128
  hidden_size: 128
  num_layers: 2
  heads: 4
  pair_architecture: concat_hA_hB_absdiff_mlp
  dropout: 0.2

training:
  seed: 42
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.00001
  early_stopping_patience: 5

inference:
  pair_batch_size: 64

threshold:
  method: validation_f1
  grid_step: 0.01
