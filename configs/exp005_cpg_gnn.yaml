# EXP-005 — M4 CPG-GNN trên POJ-104 (C++). Trạng thái: READY_FOR_KAGGLE_TRAIN.
#
# Extraction xong (DEC-027 verified, gate FULL PASS, dataset M4 đã publish).
# Train trong notebooks/exp005_cpg_gnn_kaggle.ipynb (GPU).

experiment:
  id: EXP-005
  name: cpg_gnn_poj104
  status: READY_FOR_KAGGLE_TRAIN
  seed: 42

dataset:
  name: poj104
  language: cpp
  manifest: data/manifests/poj104.json
  pairs_dir: data/pairs/poj104
  processed: data/processed/poj104/samples.jsonl

model:
  id: M4
  type: cpg_gnn
  language: cpp
  backbone: gat              # khớp BACKBONE trong src/models/cpg_gnn/model.py
  hidden_size: 128          # = hidden/num_layers/heads của CPGEncoder
  num_layers: 3
  heads: 4                  # hidden_size phải chia hết cho heads
  dropout: 0.2
  # Head y hệt M1/M2/M3 (DEC-016) để phép so sánh ở RQ1 không lệch do head.
  pair_architecture: concat_hA_hB_absdiff_mlp

# CPG không truncate theo độ dài văn bản; nó bị giới hạn theo **số node**.
# Đổi `max_nodes` là đổi feature ⇒ tách cache theo giá trị này (xem store.py).
preprocessing:
  max_nodes: 1500
  export_dir: artifacts/cpg_export   # JSON từng hàm do Joern sinh
  cache_dir: artifacts/cpg_cache
  extractor: joern
  # Số node/hàm trung bình đo trên dữ liệu thật: ~150 toàn dataset
  # (train ~148, val ~188, test ~141 — đếm trên 51.991 JSON đã trích).
  # Con số 354,6 trước đây chỉ là 500 hàm train đầu (không đại diện).
  est_nodes_per_function: 150

training:
  seed: 42
  epochs: 15                        # V2: giữ 15 (bản báo cáo dừng ở 5 do epochs=5 cũ),
  # resume từ epoch 5 train tiếp; val F1 còn tăng 0,780 -> 0,819 nên cho thêm cơ hội
  # Nhỏ hơn M1/M2 vì mỗi sample là cả đồ thị (hàng trăm node × 2 phía), không
  # phải 256 token. Đổi sau khi có log VRAM thật.
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.00001
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  max_grad_norm: 5.0
  mixed_precision: true      # GAT trên node hàng trăm chạy được fp16/bf16

diagnostic:
  bench_steps: 20

early_stopping:
  enabled: true
  monitor: val_f1
  patience: 4                       # V2: 2 -> 4 để CPG train thêm vài epoch (val còn tăng ở cuối)
  mode: max

inference:
  pair_batch_size: 32

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]

error_analysis:
  top_k: 100

runtime:
  device: cuda

output:
  directory: results/exp005_cpg_gnn_poj104
