model:
  name: hybrid_graphcodebert_cpg
  id: M5
  fusion: concat_mlp   # cấu hình INIT
  text_model: microsoft/graphcodebert-base
  graph_backbone: gat

training:
  seed: 42
  batch_size: 16
  learning_rate: 0.00002
  epochs: 5

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc]

output:
  directory: results/hybrid
