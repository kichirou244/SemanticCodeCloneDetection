experiment:
  id: EXP-BCB-004
  name: astnn_bigclonebench
  seed: 42

dataset:
  name: bigclonebench
  language: java
  hf_id: google/code_x_glue_cc_clone_detection_big_clone_bench
  data_dir: data/raw/bigclonebench
  smoke_file: data/raw/bigclonebench/bcb_smoke.parquet
  dev_file: data/raw/bigclonebench/bcb_dev.parquet

model:
  id: M3
  type: astnn
  language: java
  hidden_size: 200
  dropout: 0.2

ast:
  parser: tree_sitter_java
  abstraction: statement_level

training:
  seed: 42
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_accumulation_steps: 1
  max_grad_norm: 5.0
  mixed_precision: false

early_stopping:
  enabled: true
  monitor: val_f1
  patience: 2
  mode: max

threshold:
  method: validation_f1
  grid_step: 0.01

evaluation:
  metrics: [precision, recall, f1, roc_auc, pr_auc, accuracy]
  clone_types: [Type-1, Type-2, Strongly-Type-3, Moderately-Type-3, Weakly-Type-3-Type-4]
